<!DOCTYPE html>
<!-- Retirement routing demonstrator (preview only, noindex).
     Models one post-promote route: the Simulator root / sim home for a signed-in visitor.
     Signed-in -> https://bytebarhq.com/preview-home/practice/
     Guest     -> https://sim.bytebarhq.com/sim-preview/
     Exactly one replace() hop; the destination never routes back,
     so no cycle is possible. The production change each stub maps
     to is documented in the preview-home README's route map. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ByteBar</title>
<script>
(function () {
  var KEY = "sb-duutviqszajmmoskvdfy-auth-token", found = false, tomb = false;
  try {
    var parts = (document.cookie || "").split(";");
    for (var i = 0; i < parts.length; i++) {
      var eq = parts[i].indexOf("=");
      if (eq < 0) continue;
      var name = parts[i].slice(0, eq).replace(/^\s+|\s+$/g, "");
      if (name === KEY || name.indexOf(KEY + ".") === 0) found = true;
      if (name === "bb-auth-out") tomb = true;
    }
    if (!found && !tomb) {
      try { found = !!window.localStorage.getItem(KEY); } catch (e) {}
    }
  } catch (e) {}
  if (!found && window.location.protocol === "https:") {
    window.location.replace("https://sim.bytebarhq.com/sim-preview/");
  }
  window.__bbMaybeSession = found;
})();
</script>
<style>
  body{margin:0;background:#f6f1e6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;color:#0b1e42}
  .mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#0b1e42,#1b3a7a);
    display:flex;align-items:center;justify-content:center;color:#7ee7f7;font-size:22px;font-weight:900;
    box-shadow:0 3px 0 rgba(11,30,66,.35);margin:0 auto 14px}
  .box{text-align:center;font-weight:700;font-size:15px}
  .box span{display:block;margin-top:6px;color:#6f695c;font-weight:600;font-size:13.5px}
</style>
</head>
<body>
<div class="box"><div class="mark">B</div>BYTEBAR<span>One moment…</span></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
function bbAuthStorage() {
  var CHUNK = 3000, MAXAGE = 34560000, TOMB = "bb-auth-out";
  function jar() {
    var o = {};
    (document.cookie || "").split(";").forEach(function (p) {
      var i = p.indexOf("="); if (i > 0) o[p.slice(0, i).trim()] = p.slice(i + 1).trim();
    });
    return o;
  }
  function put(name, value, age) {
    var s = name + "=" + value + "; Domain=.bytebarhq.com; Path=/; SameSite=Lax; Max-Age=" + age;
    if (window.location.protocol === "https:") s += "; Secure";
    document.cookie = s;
  }
  function chunked(j, key) {
    if (j[key + ".0"] === undefined) return null;
    var v = "", i = 0;
    while (j[key + "." + i] !== undefined) { v += j[key + "." + i]; i++; }
    return v;
  }
  function clearChunks(key) {
    put(key, "", 0);
    for (var i = 0; i < 12; i++) put(key + "." + i, "", 0);
  }
  var store = {
    getItem: function (key) {
      var j = jar(), v = chunked(j, key);
      if (v !== null) { try { return decodeURIComponent(v); } catch (e) { return null; } }
      if (j[key] !== undefined) { try { return decodeURIComponent(j[key]); } catch (e) { return null; } }
      var ls = null;
      try { ls = window.localStorage.getItem(key); } catch (e) {}
      if (ls && j[TOMB] === undefined) { store.setItem(key, ls); return ls; }
      return null;
    },
    setItem: function (key, value) {
      try { window.localStorage.setItem(key, value); } catch (e) {}
      put(TOMB, "", 0);
      clearChunks(key);
      var enc = encodeURIComponent(value);
      if (enc.length <= CHUNK) { put(key, enc, MAXAGE); return; }
      for (var i = 0; i < enc.length; i += CHUNK) put(key + "." + (i / CHUNK), enc.slice(i, i + CHUNK), MAXAGE);
    },
    removeItem: function (key) {
      try { window.localStorage.removeItem(key); } catch (e) {}
      clearChunks(key);
      put(TOMB, "1", MAXAGE);
    }
  };
  return store;
}
(function () {
  var IN = "https://bytebarhq.com/preview-home/practice/", OUT = "https://sim.bytebarhq.com/sim-preview/";
  function go(u) { if (window.location.protocol === "https:") window.location.replace(u); }
  if (!window.__bbMaybeSession) { go(OUT); return; }
  var done = false;
  var failsafe = setTimeout(function () { if (!done) { done = true; go(OUT); } }, 3500);
  try {
    var sb = window.supabase.createClient("https://duutviqszajmmoskvdfy.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1dXR2aXFzemFqbW1vc2t2ZGZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MDc2NTUsImV4cCI6MjEwNzk4MzY1NX0.1QN33pm_ncOHxTtY3_NUI1j2BcihogfBVsvf_C2OMO4",
      { auth: { storage: bbAuthStorage() } });
    sb.auth.getSession().then(function (r) {
      if (done) return; done = true; clearTimeout(failsafe);
      var s = r && r.data && r.data.session;
      go(s && s.user ? IN : OUT);
    }).catch(function () { if (!done) { done = true; go(OUT); } });
  } catch (e) { if (!done) { done = true; go(OUT); } }
})();
</script>
</body>
</html>
